[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-reasoning"
version = "0.1.0"
description = "Evidence-grounded topic discovery and hypothesis reasoning prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "typer>=0.16,<1",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "jsonschema>=4,<5",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hypothesis_reasoning = [
  "prompts/critique/*.md",
  "prompts/generation/*.md",
  "prompts/refinement/*.md",
  "prompts/topic/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/hypothesis_reasoning"]

[project.scripts]
hypothesis-reasoning = "hypothesis_reasoning.cli:app"
